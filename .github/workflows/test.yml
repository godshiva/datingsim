name: Tests

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore DatingSim.Tests/DatingSim.Tests.csproj

      - name: Test
        run: dotnet test DatingSim.Tests/DatingSim.Tests.csproj --no-restore --verbosity normal
